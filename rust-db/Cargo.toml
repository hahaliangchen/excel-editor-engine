[package]
name = "db-studio-engine"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "db-server"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
cap-std = "4"
cap-fs-ext = "4"
chrono = { version = "0.4", features = ["serde"] }
excel-editor-engine = { path = "../rust-excel" }
fs2 = "0.4"
futures-util = "0.3"
libsqlite3-sys = "0.30"
rust_decimal = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sqlparser = { version = "0.62", default-features = false, features = ["std", "visitor"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "sqlite", "mysql", "postgres", "chrono", "rust_decimal", "json", "uuid"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
strip = true
